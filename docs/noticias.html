<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Academic Brain — Boletines</title>
<link rel="icon" href="logo.webp" type="image/webp" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="revista.css">
</head>
<body>

<header id="topbar">
  <button class="tb-btn" id="menu-toggle" aria-label="Sumario de boletines" aria-expanded="false">Sumario</button>
  <a class="tb-wordmark" href="index.html">Academic <em>Brain</em></a>
  <span class="tb-spacer"></span>
  <span class="tb-meta" id="tb-meta"></span>
</header>

<div id="backdrop"></div>

<nav id="sidebar" aria-label="Sumario">
  <div class="sb-head">
    <span class="kicker">Boletines</span>
    <h1>Sumario</h1>
    <p>Dos cuadernos · una entrada por semana</p>
    <a class="back" href="index.html">← Volver al grafo</a>
  </div>
  <div id="coll-list"></div>
</nav>

<main id="main">
  <div id="article-wrap">
    <div id="masthead"></div>
    <div class="layout">
      <div id="article"><div class="placeholder">Abra el sumario para elegir un boletín.</div></div>
      <aside class="toc" id="toc"></aside>
    </div>
    <div class="colofon-block" id="colofon"></div>
  </div>
</main>

<script src="noticias-data.js"></script>
<script>
(function () {
  const data = window.__NOTICIAS__ || { collections: [] };
  const byId = new Map();
  const collOf = new Map();
  for (const coll of data.collections) {
    for (const entry of coll.entries) {
      byId.set(entry.id, entry);
      collOf.set(entry.id, coll);
    }
  }

  const collListEl = document.getElementById("coll-list");
  const articleEl = document.getElementById("article");
  const mastheadEl = document.getElementById("masthead");
  const tocEl = document.getElementById("toc");
  const colofonEl = document.getElementById("colofon");
  const tbMetaEl = document.getElementById("tb-meta");
  const sidebarEl = document.getElementById("sidebar");
  const backdropEl = document.getElementById("backdrop");
  const menuBtn = document.getElementById("menu-toggle");

  const esc = (s) =>
    String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function openMenu() {
    sidebarEl.classList.add("open");
    backdropEl.classList.add("open");
    menuBtn.setAttribute("aria-expanded", "true");
  }
  function closeMenu() {
    sidebarEl.classList.remove("open");
    backdropEl.classList.remove("open");
    menuBtn.setAttribute("aria-expanded", "false");
  }
  menuBtn.addEventListener("click", () => {
    sidebarEl.classList.contains("open") ? closeMenu() : openMenu();
  });
  backdropEl.addEventListener("click", closeMenu);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

  function renderSidebar(activeId) {
    collListEl.innerHTML = "";
    for (const coll of data.collections) {
      const section = document.createElement("div");
      section.className = "coll";
      section.style.setProperty("--coll-pig", coll.pigmentoVar || "var(--pigment-vermilion)");

      const hdr = document.createElement("div");
      hdr.className = "coll-hdr";
      hdr.innerHTML =
        '<span class="dot"></span><span>' + esc(coll.label) + '</span><span class="line"></span>';
      section.appendChild(hdr);

      if (!coll.entries.length) {
        const empty = document.createElement("div");
        empty.className = "empty-msg";
        empty.textContent = "Sin entradas por ahora.";
        section.appendChild(empty);
      }

      for (const entry of coll.entries) {
        const btn = document.createElement("button");
        btn.className = "entry-btn" + (entry.id === activeId ? " active" : "");
        btn.dataset.id = entry.id;
        btn.innerHTML =
          '<span class="entry-num">' + String(entry.edicion || "").padStart(2, "0") + "</span>" +
          "<span>" +
            '<span class="entry-date">' + esc(entry.dateLabel || "sin fecha") + "</span>" +
            '<span class="entry-title">' + esc(entry.title) + "</span>" +
          "</span>";
        btn.addEventListener("click", () => selectEntry(entry.id, true));
        section.appendChild(btn);
      }
      collListEl.appendChild(section);
    }
  }

  function renderMasthead(entry, coll) {
    const tags = (entry.etiquetas || [])
      .map((t) => "<span>" + esc(t) + "</span>").join("");
    mastheadEl.innerHTML =
      '<div class="masthead">' +
        '<div class="mh-rail">' +
          '<span class="left">' + esc(entry.kicker || coll.kicker || coll.label) +
            " · " + String(entry.edicion || "").padStart(2, "0") + "</span>" +
          '<span class="right">' + esc(coll.label) + "</span>" +
        "</div>" +
        '<div class="mh-slab"></div>' +
        '<h1 class="mh-title">' + esc(entry.title) + "</h1>" +
        (entry.deck ? '<p class="mh-deck">' + entry.deck + "</p>" : "") +
        '<div class="mh-foot">' +
          '<div class="tags">' + tags + "</div>" +
          "<div>" + esc(entry.dateLabel || "sin fecha") +
            " · " + (entry.lectura || 1) + " min · edición " +
            esc(entry.edicionRomana || entry.edicion || "") + "</div>" +
        "</div>" +
      "</div>";
  }

  function renderToc(entry) {
    const idx = entry.indice || [];
    if (!idx.length) { tocEl.innerHTML = ""; return; }
    tocEl.innerHTML =
      '<div class="toc-hdr">En este número</div>' +
      idx.map((s) =>
        '<a href="#' + esc(entry.id) + '" data-anchor="' + esc(s.slug) + '">' +
          '<span class="n">' + esc(s.n) + "</span><span>" + esc(s.titulo) + "</span></a>"
      ).join("");
    tocEl.querySelectorAll("[data-anchor]").forEach((a) => {
      a.addEventListener("click", (ev) => {
        ev.preventDefault();
        const el = document.getElementById(a.dataset.anchor);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }

  function renderColofon(entry, coll) {
    colofonEl.innerHTML =
      "<div>" + esc(coll.label) + " · edición " + esc(entry.edicionRomana || "") + "<br>" +
        esc(entry.dateLabel || "") + " · " + (entry.palabras || 0) + " palabras<br>" +
        "Composición en Instrument Serif, Newsreader, Archivo y JetBrains Mono.</div>" +
      '<div style="text-align:right">' +
        '<div class="wordmark">Academic <em>Brain</em></div>' +
        "luisreyes · Universidad de los Andes</div>";
  }

  function renderArticle(entry, emptyMessage) {
    if (!entry) {
      mastheadEl.innerHTML = "";
      tocEl.innerHTML = "";
      colofonEl.innerHTML = "";
      tbMetaEl.textContent = "";
      articleEl.innerHTML =
        '<div class="placeholder">' + (emptyMessage || "Abra el sumario para elegir un boletín.") + "</div>";
      return;
    }
    const coll = collOf.get(entry.id) || {};
    document.documentElement.style.setProperty(
      "--pig", entry.pigmentoVar || coll.pigmentoVar || "var(--pigment-vermilion)"
    );

    renderMasthead(entry, coll);
    articleEl.innerHTML = entry.html;
    renderToc(entry);
    renderColofon(entry, coll);
    tbMetaEl.textContent = (entry.dateLabel || "") + " · " + (entry.lectura || 1) + " min";

    // navegación interna entre boletines (referencias cruzadas)
    articleEl.querySelectorAll("[data-goto]").forEach((a) => {
      a.addEventListener("click", (ev) => {
        ev.preventDefault();
        selectEntry(a.dataset.goto, true);
      });
    });
  }

  function selectEntry(id, push) {
    const entry = byId.get(id);
    renderArticle(entry);
    renderSidebar(id);
    if (push) location.hash = id;
    window.scrollTo({ top: 0 });
    closeMenu();
  }

  function mostRecentId(collectionDir) {
    let best = null;
    for (const coll of data.collections) {
      if (collectionDir && coll.dir !== collectionDir) continue;
      for (const entry of coll.entries) {
        if (!best || (entry.date || "") > (best.date || "")) best = entry;
      }
    }
    return best ? best.id : null;
  }

  // Resuelve un valor de hash: id de entrada exacto, nombre de colección
  // (selecciona su entrada más reciente) o vacío (más reciente global).
  function resolveHash(raw) {
    if (!raw) return { id: mostRecentId(), emptyMessage: null };
    if (byId.has(raw)) return { id: raw, emptyMessage: null };
    const coll = data.collections.find((c) => c.dir === raw);
    if (coll) {
      const id = mostRecentId(raw);
      return { id, emptyMessage: id ? null : 'Aún no hay boletines en "' + coll.label + '".' };
    }
    return { id: mostRecentId(), emptyMessage: null };
  }

  function handleHash() {
    const { id, emptyMessage } = resolveHash(decodeURIComponent(location.hash.slice(1)));
    renderSidebar(id);
    renderArticle(id ? byId.get(id) : null, emptyMessage);
  }

  window.addEventListener("hashchange", handleHash);
  handleHash();
})();
</script>
</body>
</html>
